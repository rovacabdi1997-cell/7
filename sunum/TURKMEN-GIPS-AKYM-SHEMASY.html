<meta charset="utf-8">
<title>Akylly Zawod Ulgamy</title>
<style>
:root{
  --bg:#EDF2F7; --surface:#FFFFFF; --surface2:#F6F9FC; --floor:#E7EEF4;
  --line:#DAE4EC; --line2:#C2D3E0;
  --txt:#132330; --muted:#63788A; --dim:#9AAEBE;
  --acc:#1E9BE0; --acc2:#0C6FB8; --acc3:#8FD3F7;
  --warn:#E0871F; --crit:#DC3A50; --hold:#7A5AF8;
  --disp:"Bahnschrift","DIN Alternate","Segoe UI Semibold",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--body);min-height:100vh;overflow-x:hidden}
.wrap{display:grid;grid-template-columns:214px minmax(0,1fr) 310px;grid-template-rows:auto 1fr auto;min-height:100vh}

/* ---------- ýokarky zolak ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:9px 18px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:36px;height:30px;flex:none}
.brand b{font-family:var(--disp);font-size:14.5px;letter-spacing:.11em;display:block}
.brand span{font-size:9px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.top .sep{flex:1}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:5px 9px;border:1px solid var(--line2);
  border-radius:3px;color:var(--muted);text-transform:uppercase;white-space:nowrap;background:var(--surface2)}
.tag.sim{color:#9A5B05;border-color:#F0D3A6;background:#FEF6E9}
.tag.doc{color:var(--acc2);border-color:#B9DFF6;background:#EBF6FD}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}

/* ---------- çep menýu ---------- */
.rail{grid-column:1/2;grid-row:2/4;background:var(--surface);border-right:1px solid var(--line);
  padding:9px 8px;overflow-y:auto}
.rail h6{font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;color:var(--dim);text-transform:uppercase;
  margin:11px 8px 6px}
.mi{display:grid;grid-template-columns:44px 1fr;gap:9px;align-items:center;width:100%;padding:5px;border-radius:9px;
  border:1px solid transparent;background:none;cursor:pointer;font:inherit;text-align:left;color:var(--txt);
  transition:.15s;margin-bottom:2px}
.mi img{width:44px;height:30px;object-fit:cover;border-radius:5px;display:block;filter:saturate(.85)}
.mi .ph{width:44px;height:30px;border-radius:5px;background:var(--floor)}
.mi b{display:block;font-size:11.5px;font-weight:600;line-height:1.25}
.mi i{display:block;font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.11em;
  color:var(--muted);text-transform:uppercase;margin-top:1px}
.mi:hover{background:var(--surface2);border-color:var(--line)}
.mi[aria-current="true"]{background:#EBF6FD;border-color:#B9DFF6}
.mi[aria-current="true"] b{color:var(--acc2)}
.mi[aria-current="true"] img{filter:none}
.mi:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}

/* ---------- esasy meýdan ---------- */
.stage{grid-column:2/3;grid-row:2/3;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.kpi{padding:8px 11px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi label{display:block;font-size:8.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--disp);font-size:23px;margin-top:1px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:10.5px;color:var(--muted);margin-left:3px;font-family:var(--body)}
.kpi.is-warn .v{color:var(--warn)}
.kpi.is-crit .v{color:var(--crit)}
.spark{display:block;width:100%;height:13px;margin-top:2px}
.kpi .d{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:3px}

.scroll{overflow-y:auto;flex:1;min-height:0;padding:14px}

/* ---------- bölüm başy ---------- */
.hero{position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;background:#0B1D2A;
  border:1px solid var(--line2)}
.hero img{width:100%;height:190px;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 20px;
  background:linear-gradient(90deg,rgba(6,20,30,.86) 0%,rgba(6,20,30,.55) 46%,rgba(6,20,30,.12) 100%)}
.hero .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#8FD3F7;text-transform:uppercase}
.hero h1{font-family:var(--disp);font-size:27px;margin:5px 0 0;color:#fff;letter-spacing:.01em}
.hero p{margin:6px 0 0;font-size:12.5px;color:#C6DDEB;max-width:62ch;line-height:1.5}

.cols{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.card h4{font-family:var(--disp);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);
  margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.enters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.enters li{display:grid;grid-template-columns:15px 1fr;gap:8px;font-size:12.3px;line-height:1.45}
.enters li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);margin:6px 0 0 4px}
.enters li b{font-weight:600}
.flowbox{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;overflow-x:auto}
svg.flow{width:100%;height:auto;min-width:640px;display:block}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.mc{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.mc label{display:block;font-size:8.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
.mc b{font-family:var(--disp);font-size:21px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.mc i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim);display:block;margin-top:2px}
.mc.ok b{color:var(--acc2)} .mc.w b{color:var(--warn)} .mc.c b{color:var(--crit)} .mc.h b{color:var(--hold)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 7px;border-radius:9px;
  text-transform:uppercase}
.p-ok{background:#EBF6FD;color:var(--acc2)} .p-w{background:#FDF2E4;color:#9A5B05}
.p-c{background:#FDECEE;color:#A32333} .p-h{background:#F1ECFE;color:#5A3ED6}
.aiwarn{background:#FDF2E4;border:1px solid #F0D3A6;border-radius:10px;padding:12px 14px;font-size:12.5px;
  line-height:1.55;color:#7A4A05}
.aiwarn b{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}

/* ---------- shema düwünleri ---------- */
.nd{cursor:pointer}
.nd:focus-visible{outline:none}
.nd:focus-visible .nbox{stroke:var(--acc2);stroke-width:3}
text{font-family:var(--body);fill:var(--muted)}
.t-name{font-size:11px;fill:#22333F}
.t-tag{font-family:var(--mono);font-size:8px;fill:var(--dim)}
.t-val{font-family:var(--mono);font-size:8.5px}
.t-band{font-family:var(--disp);font-size:11px;letter-spacing:.17em;fill:#9DB2C2}

/* ---------- ssenariý ---------- */
.scen{grid-column:2/3;grid-row:3/4;display:flex;gap:7px;align-items:center;padding:8px 14px;
  background:var(--surface);border-top:1px solid var(--line);overflow-x:auto}
.scen b{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.sc{font:inherit;font-size:11.5px;padding:6px 12px;border:1px solid var(--line2);background:var(--surface);
  color:var(--muted);border-radius:15px;cursor:pointer;white-space:nowrap;transition:.15s}
.sc:hover{color:var(--acc2);border-color:var(--acc)}
.sc[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.sc.risk[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.sc.bad[aria-pressed="true"]{background:var(--crit);border-color:var(--crit)}
.sc:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* ---------- wakalar ---------- */
.side{grid-column:3/4;grid-row:2/4;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.side h2{font-family:var(--disp);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);
  margin:0;padding:12px 15px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.side h2 em{font-style:normal;font-family:var(--mono);font-size:10px}
.feed{overflow-y:auto;flex:1;min-height:0}
.ev{display:grid;grid-template-columns:3px 1fr;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line)}
.ev .bar{border-radius:2px;background:var(--acc)}
.ev.s-crit .bar{background:var(--crit)} .ev.s-warn .bar{background:var(--warn)} .ev.s-hold .bar{background:var(--hold)}
.ev .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ev .src{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ev .t{font-family:var(--mono);font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.ev p{margin:4px 0 0;font-size:12px;line-height:1.45;color:var(--txt)}
.ev .meta{margin-top:4px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.ev.new{animation:sl .4s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* ---------- çekmece ---------- */
.drawer{position:fixed;top:0;right:0;width:min(400px,92vw);height:100vh;background:var(--surface);
  border-left:1px solid var(--line2);transform:translateX(103%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:40;display:flex;flex-direction:column;box-shadow:-24px 0 48px rgba(19,35,48,.13)}
.drawer.open{transform:none}
.drawer header{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px}
.drawer h3{font-family:var(--disp);font-size:18px;margin:0}
.drawer .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;color:var(--muted);text-transform:uppercase;margin-top:5px}
.x{background:none;border:1px solid var(--line2);color:var(--muted);width:28px;height:28px;border-radius:50%;
  cursor:pointer;font-size:14px;line-height:1;flex:none}
.dbody{overflow-y:auto;padding:15px 18px;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.cell{background:var(--surface2);padding:9px 11px}
.cell label{display:block;font-size:8.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
.cell b{font-family:var(--disp);font-size:17px;font-weight:500;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.chain{display:flex;flex-direction:column}
.chain .step{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:7px 0}
.chain .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);margin:5px 0 0 5px;position:relative}
.chain .step:not(:last-child) .dot::after{content:"";position:absolute;left:4px;top:11px;width:1px;
  height:calc(100% + 7px);background:var(--line2)}
.chain .mod-n{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;color:var(--muted);text-transform:uppercase}
.chain p{margin:2px 0 0;font-size:12px;line-height:1.45}
.act{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:11.5px;padding:8px 13px;border-radius:6px;cursor:pointer;background:var(--surface);
  border:1px solid var(--line2);color:var(--txt)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn:hover{border-color:var(--acc)}
.note{font-size:10.5px;color:var(--muted);line-height:1.5;border-left:2px solid var(--line2);padding-left:10px}
h4.dh{font-family:var(--disp);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);
  margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1240px){
  .wrap{grid-template-columns:214px 1fr;grid-template-rows:auto auto auto auto}
  .rail{grid-row:2/5}
  .stage{grid-column:2/3;grid-row:2/3}
  .scen{grid-column:2/3;grid-row:3/4}
  .side{grid-column:2/3;grid-row:4/5;border-left:0;border-top:1px solid var(--line);max-height:270px}
  .cols{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
}

function nodeSVG(n){
  const w=48,h=30,half=w/2;
  let tx=n.x, anchor="middle", ty;
  if(n.side){ anchor = n.side>0?"start":"end"; tx = n.x + n.side*(half+9); ty = n.y - 3; }
  else ty = n.up ? n.y - h/2 - 21 : n.y + h/2 + 14;
  return '<g class="nd" data-st="'+n.id+'" tabindex="0" role="button" aria-label="'+n.n+'">'
    + '<rect class="nhalo" x="'+(n.x-half-5)+'" y="'+(n.y-h/2-5)+'" width="'+(w+10)+'" height="'+(h+10)+'" rx="11" fill="#1E9BE0" opacity="0"/>'
    + '<rect class="nbox" x="'+(n.x-half)+'" y="'+(n.y-h/2)+'" width="'+w+'" height="'+h+'" rx="7" fill="#FFFFFF" stroke="#1E9BE0" stroke-width="2"/>'
    + '<circle class="ndot" cx="'+n.x+'" cy="'+n.y+'" r="5" fill="#1E9BE0"/>'
    + '<text class="t-tag"  x="'+tx+'" y="'+(ty-10)+'" text-anchor="'+anchor+'">'+n.tag+'</text>'
    + '<text class="t-name" x="'+tx+'" y="'+ty+'" text-anchor="'+anchor+'">'+n.n+'</text>'
    + '<text class="t-val nval" x="'+tx+'" y="'+(ty+13)+'" text-anchor="'+anchor+'" fill="#63788A">'+n.kpi[0]+' '+n.kpi[1]+'</text>'
    + '</g>';
}
function railLine(a,b,y,dir){
  let s = '<line x1="'+a+'" y1="'+y+'" x2="'+b+'" y2="'+y+'" stroke="#D3E1EC" stroke-width="9" stroke-linecap="round"/>';
  if(dir>0) for(let x=a+42;x<b-18;x+=128) s+='<line x1="'+x+'" y1="'+y+'" x2="'+(x+24)+'" y2="'+y+'" stroke="#AEC4D4" stroke-width="2" marker-end="url(#ar)"/>';
  else      for(let x=b-42;x>a+18;x-=128) s+='<line x1="'+x+'" y1="'+y+'" x2="'+(x-24)+'" y2="'+y+'" stroke="#AEC4D4" stroke-width="2" marker-end="url(#ar)"/>';
  return s;
}
const MARKER = '<defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="11" markerHeight="11"'
             + ' markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AEC4D4"/></marker></defs>';

function flowSVG(which){
  let s = MARKER, vb;
  if(which==="core"){
    vb = "0 0 1520 345";
    s += railLine(90,1370,90,1);
    s += '<path d="M1370 90 L1455 90 L1455 240 L1400 240" fill="none" stroke="#D3E1EC" stroke-width="9" stroke-linecap="round"/>';
    s += railLine(90,1370,240,-1);
    s += '<path d="M968 300 L790 262" fill="none" stroke="#D3E1EC" stroke-width="6" marker-end="url(#ar)"/>';
    s += '<path d="M90 256 L90 310 L172 310" fill="none" stroke="#D3E1EC" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>';
    s += '<text class="t-band" x="180" y="315">SILOS №3 (A bölümi) we SILOS №4 (B bölümi) tarapa</text>';
    s += F_CORE.map(nodeSVG).join("");
  } else if(which==="A"){
    vb = "0 0 1520 300";
    s += railLine(90,1420,110,1);
    s += '<path d="M350 234 L350 130" fill="none" stroke="#D3E1EC" stroke-width="6" marker-end="url(#ar)"/>';
    s += '<path d="M480 234 L480 130" fill="none" stroke="#D3E1EC" stroke-width="6" marker-end="url(#ar)"/>';
    s += F_A.map(nodeSVG).join("");

    vb = "0 0 1060 350";
    s += railLine(90,870,100,1);
    s += '<path d="M540 204 L540 120" fill="none" stroke="#D3E1EC" stroke-width="6" marker-end="url(#ar)"/>';
    s += '<path d="M90 116 L90 300 L206 300" fill="none" stroke="#D3E1EC" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>';
    s += '<line x1="254" y1="300" x2="406" y2="300" stroke="#D3E1EC" stroke-width="7" stroke-linecap="round"/>';
    s += '<line x1="320" y1="300" x2="344" y2="300" stroke="#AEC4D4" stroke-width="2" marker-end="url(#ar)"/>';
    s += F_B.map(nodeSVG).join("");
  }
  return '<svg class="flow" viewBox="'+vb+'" role="img" aria-label="Tehnologiki shema">'+s+'</svg>';
}

/* ---------- ýagdaý ---------- */
function applyStates(){
  document.querySelectorAll(".nd").forEach(g=>{
    const id = g.dataset.st, c = COL[statusOf(id)];
    g.querySelector(".nbox").setAttribute("stroke", c);
    g.querySelector(".ndot").setAttribute("fill", c);
    g.querySelector(".nhalo").setAttribute("fill", c);
    const n = ALL.find(x=>x.id===id), ov = (SCEN[scenario].over || {})[id];
    const v = g.querySelector(".nval");
    v.textContent = ov ? n.kpi[0]+" "+ov[0] : n.kpi[0]+" "+n.kpi[1];
    v.setAttribute("fill", ov ? c : "#63788A");
  });
}
function renderFeed(){
  const sc = SCEN[scenario];
  document.getElementById("feed").innerHTML = [...sc.events].reverse().map(e =>
    '<div class="ev s-'+e.s+' new"><div class="bar"></div><div>'
    + '<div class="h"><span class="src">'+e.src+'</span><span class="t">'+e.t+'</span></div>'
    + '<p>'+e.x+'</p><div class="meta">'+e.m+'</div></div></div>').join("");
  const active = sc.events.filter(e=>e.s!=="ok").length;
  const el = document.getElementById("alarmCount");
  el.textContent = active + " işjeň";
  el.style.color = active ? (sc.events.some(e=>e.s==="crit") ? COL.crit : COL.warn) : COL.run;
  return active;
}
function setScenario(name){
  scenario = name; t0 = performance.now();
  document.querySelectorAll(".sc").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.sc===name)));
  applyStates();
  activeAlarms = renderFeed();
  if(sel) openDrawer(sel);
}
document.querySelectorAll(".sc").forEach(b => b.addEventListener("click", ()=>setScenario(b.dataset.sc)));
document.getElementById("rail").addEventListener("click", e=>{
  const b = e.target.closest(".mi"); if(!b) return;
  section = b.dataset.sec;
  document.querySelectorAll(".mi").forEach(x=>x.setAttribute("aria-current", String(x===b)));
  document.getElementById("scroll").scrollTop = 0;
  renderSection();
});

function val(k){
  const sc = SCEN[scenario];
  const base = (sc.kpi && sc.kpi[k.k]!==undefined) ? sc.kpi[k.k] : k.base;
  if(k.k==="alarm") return activeAlarms;
  const s=(performance.now()-t0)/1000, amp=base*0.012;
  return base + amp*Math.sin(s/3.1 + k.k.length) + amp*0.4*Math.sin(s/1.3 + k.base);
}
function spark(el,arr){
  const min=Math.min(...arr), max=Math.max(...arr), r=(max-min)||1;
  el.setAttribute("d","M"+arr.map((v,i)=>(i/(arr.length-1)*100).toFixed(1)+","+(12-((v-min)/r)*10).toFixed(1)).join(" L"));
}
function tick(){
  frame++;
  const s=(performance.now()-t0)/1000;
  document.getElementById("clock").textContent = new Date(Date.now()+5*3600e3).toISOString().slice(11,19);
  KPI.forEach(k=>{
    const v=val(k), cell=document.querySelector('.kpi[data-k="'+k.k+'"]');
    cell.querySelector(".n").textContent = fmt(v,k.d);
    let cls="";
    if(k.k==="alarm" && v>0) cls = SCEN[scenario].events.some(e=>e.s==="crit") ? "is-crit":"is-warn";
    if(k.target && v < k.target*0.93) cls="is-warn";
    if(k.k==="power" && v>5) cls="is-warn";
    if(k.k==="oee" && v<72) cls="is-crit";
    cell.className="kpi "+cls;
    if(frame%6===0){ hist[k.k].push(v); hist[k.k].shift(); }
    const sl=cell.querySelector(".sl");
    if(sl){ spark(sl,hist[k.k]); sl.setAttribute("stroke", cls==="is-crit"?COL.crit:cls==="is-warn"?COL.warn:COL.run); }
  });
  const bl=(s%1.6)/1.6;
  document.querySelectorAll(".nd").forEach(g=>{
    const st=statusOf(g.dataset.st), halo=g.querySelector(".nhalo");
    halo.setAttribute("opacity", st==="run" ? "0" : (0.3*(1-bl)).toFixed(2));
  });
  requestAnimationFrame(tick);
}

        + '<div><div class="mod-n">'+c.m+'</div><p>'+c.p+'</p></div></div>').join("")+'</div></section>' : '';
  const cs = ov ? ' style="color:'+COL[st]+'"' : '';
  document.getElementById("dBody").innerHTML =
      '<div class="grid2">'
    + '<div class="cell"><label>'+n.kpi[0]+'</label><b'+cs+'>'+(ov?ov[0]:n.kpi[1])+'</b></div>'
    + '<div class="cell"><label>'+n.det[0]+'</label><b'+cs+'>'+(ov?ov[1]:n.det[1])+'</b></div>'
    + '<div class="cell"><label>Çalşykdaky duruş</label><b>'+(st==="run"?"0 min":st==="crit"?"14 min":"4 min")+'</b></div>'
    + '<div class="cell"><label>Energiýa</label><b>'+(0.06+n.n.length*0.010).toFixed(2)+' MW</b></div>'
    + '</div>' + ch
    + '<section><h4 class="dh">Hereket</h4><div class="act">'
    + '<button class="btn p" data-act="wo">Tehniki tabşyryk döret</button>'
    + '<button class="btn" data-act="ack">Duýduryşy kabul et</button>'
    + '<button class="btn" data-act="map">Kartada görkez</button>'
