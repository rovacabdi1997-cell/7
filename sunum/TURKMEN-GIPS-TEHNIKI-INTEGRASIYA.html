const fallback='tk';let lang='tk',idx=0;
const arr=(key)=>L[lang][key]||L[fallback][key];
function t(key){return L[lang][key]??L[fallback][key]??key}
function card(n,x){return `<article class="step"><div class="n">${String(n).padStart(2,'0')}</div><h3>${x[0]}</h3><p>${x[1]}</p><span class="proto">${x[2]}</span></article>`}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=t(e.dataset.k));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 const api=arr('api');document.querySelector('#apiSteps').innerHTML=api.map((x,i)=>card(i+1,x)).join('');
 const layer=(x,c='')=>`<div class="layer ${c}"><span class="n">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`;
 document.querySelector('#otLayers').innerHTML=arr('ot').map(x=>layer(x)).join('<div class="connector">↓</div>');document.querySelector('#coreLayers').innerHTML=arr('core').map((x,i)=>layer(x,i===3?'ai':'core')).join('<div class="connector">↓</div>');
 document.querySelector('#channels').innerHTML=arr('channels').map(x=>`<div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
 document.querySelector('#hardware').innerHTML=arr('hardware').map((x,i)=>`<article class="hw ${x.recommended?'recommended':''}">${x.recommended?'<span class="priceflag">RECOMMENDED</span>':''}<span class="role">${x.role}</span><h3>${x.title}</h3>${i===0?'<div class="ha"><div class="server">EDGE A</div><span class="plus">↔</span><div class="server">EDGE B</div></div>':i===1?'<div class="ha"><div class="server gpu">96 GB ECC GPU</div><span class="plus">+</span><div class="server">256 GB ECC RAM</div></div>':''}<ul>${x.items.map(v=>`<li>${v}</li>`).join('')}</ul><div class="why">${x.why}</div></article>`).join('');
 document.querySelector('#aiSteps').innerHTML=arr('ai').map((x,i)=>`<article class="ai-step"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.querySelector('#guards').innerHTML=arr('guards').map(x=>`<div>${x}</div>`).join('');document.querySelector('#phases').innerHTML=arr('phases').map((x,i)=>`<article class="phase"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${x[0]}</h3><p>${x[1]}</p><em>${x[2]}</em></article>`).join('');show(idx)}
function show(n){idx=(n+6)%6;document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===idx));document.querySelectorAll('#progress button').forEach((b,i)=>b.classList.toggle('active',i===idx));document.querySelector('#pageNo').textContent=String(idx+1).padStart(2,'0')}
document.querySelector('#progress').innerHTML=Array.from({length:6},(_,i)=>`<button aria-label="${i+1}" data-i="${i}"></button>`).join('');document.querySelectorAll('#progress button').forEach(b=>b.onclick=()=>show(+b.dataset.i));document.querySelector('#home').onclick=()=>location.href='TURKMEN-GIPS-BAKANLIK-SUNUMU.html';document.querySelector('#prev').onclick=()=>show(idx-1);document.querySelector('#next').onclick=()=>show(idx+1);document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')show(idx+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(idx-1);if(e.key==='f'||e.key==='F')document.querySelector('#full').click()});render();
</script>
